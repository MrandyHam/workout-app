<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="apple-mobile-web-app-title" content="增肌打卡" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#FFF8E8" />
<title>增肌打卡 · Haolin</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#FFF8E8;font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;color:#5a3a3a}
.wrap{max-width:480px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom));position:relative}
button{font-family:inherit;cursor:pointer}
h1{font-size:40px;margin:14px 0 8px;color:#F27C97;letter-spacing:2px;text-shadow:3px 3px 0 #fff,-2px -2px 0 #fff;font-weight:900}
.bearbtn{position:absolute;right:12px;top:calc(8px + env(safe-area-inset-top));width:112px;height:112px;display:flex;align-items:center;justify-content:center;background:none;border:0;padding:0}
.bearbtn img{width:104px}
.chip{display:inline-block;background:#EAF4FF;border:2px solid #A9CDF0;border-radius:20px;padding:6px 12px;font-size:13px;font-weight:700;color:#5a3a3a}
.pf-bmi{margin-left:8px}
.suggest{font-size:12px;color:#a07070;margin-top:8px;min-height:16px}
.tabs{display:flex;gap:10px;margin:14px 0 14px}.tab{flex:1;text-align:center;padding:10px;border-radius:22px;font-size:20px;font-weight:900;background:#DCEBFB;border:2px solid #A9CDF0;color:#5a3a3a}
.tab.on{background:#FFD3DD;border-color:#F27C97;color:#d4506f}
.prog{border:2px solid #9ED9C0;border-radius:18px;background:#fff;height:30px;position:relative;overflow:hidden;margin-bottom:16px}
.prog i{position:absolute;left:0;top:0;bottom:0;width:0;background:#A8E4CC;transition:width .3s}.prog span{position:absolute;width:100%;text-align:center;line-height:26px;font-size:14px;font-weight:700}
.card{background:#FFEFF3;border:2.5px solid #F5B5C5;border-radius:24px;padding:12px;margin-bottom:14px;box-shadow:0 3px 0 #F5C9D4}
.card:nth-child(even){background:#EEF6FF;border-color:#B5D3F2;box-shadow:0 3px 0 #C9DEF5}
.card h3{margin:2px 4px 10px;font-size:19px}.card h3 small{font-size:14px;color:#a07070;margin-left:6px}
.row{display:flex;gap:10px}.img{width:118px;height:118px;flex:none;border-radius:18px;overflow:hidden;border:2px solid #fff;padding:0;background:#fff}
.img img{width:100%;height:100%;display:block}
.sets{flex:1;background:#fff;border-radius:16px;padding:8px;display:flex;flex-direction:column;justify-content:space-around;gap:4px;min-width:0}
.set{display:flex;align-items:center;gap:4px;white-space:nowrap;font-size:13px;font-weight:700}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid #F27C97;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;background:#fff;color:#fff;padding:0}
.ck.on{background:#F27C97}
.in{width:40px;height:26px;border:1.5px dashed #C9B3B3;border-radius:8px;text-align:center;font-size:13px;color:#5a3a3a;background:#fff;padding:0;font-family:inherit;font-weight:700}
.in:not(:placeholder-shown){border:1.5px solid #F27C97;background:#FFF5F7}
.in:focus{outline:none;border-color:#F27C97}
.btn{display:block;width:100%;margin-top:8px;background:#7FD3B0;border:3px solid #fff;box-shadow:0 0 0 2.5px #5DBB95;border-radius:30px;text-align:center;color:#fff;font-size:24px;font-weight:900;padding:14px}
.modal{position:fixed;inset:0;background:rgba(90,58,58,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.on{display:flex}.box{width:100%;max-width:340px;background:#FFF8E8;border:3px solid #F5B5C5;border-radius:28px;padding:16px;position:relative;text-align:center}
.box h3{margin:4px 30px 10px;font-size:20px}
.box>img{width:100%;border-radius:18px;display:block}.x{position:absolute;right:12px;top:10px;width:32px;height:32px;border-radius:50%;background:#FFD3DD;font-size:20px;line-height:32px;font-weight:900;color:#d4506f;border:0;padding:0}
.lg{display:flex;justify-content:center;gap:20px;font-size:15px;font-weight:700;margin-top:10px}.lg i{display:inline-block;width:16px;height:16px;border-radius:5px;vertical-align:-2px;margin-right:5px}
.form{text-align:left}.form label{display:block;font-size:13px;font-weight:700;margin:10px 0 4px}
.form input,.form select{width:100%;height:40px;border:2px solid #F5B5C5;border-radius:12px;padding:0 10px;font-size:16px;background:#fff;color:#5a3a3a;font-family:inherit}
.err{color:#d4506f;font-size:13px;min-height:18px;margin-top:6px}
.act{display:flex;gap:10px;margin-top:8px}.act button{flex:1;height:42px;border-radius:21px;font-size:16px;font-weight:900;border:2px solid #F5B5C5;background:#fff;color:#d4506f}
.act button.pri{background:#F27C97;border-color:#F27C97;color:#fff}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#5a3a3a;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;display:none;z-index:60;max-width:90%;text-align:center}
/* history */
#hist{display:none}.histmode #main{display:none}.histmode #hist{display:block}
.top{display:flex;align-items:center;gap:10px}
.back{width:40px;height:40px;border-radius:50%;background:#fff;border:2px solid #F5B5C5;font-size:22px;font-weight:900;color:#d4506f;display:flex;align-items:center;justify-content:center;padding:0}
.top h1{flex:1;font-size:30px;margin:0}
.hb{width:78px;height:78px;display:flex;align-items:center;justify-content:center}.hb img{width:72px}
.chips{display:flex;gap:8px;margin:16px 0}.chips .c{flex:1;background:#fff;border:2px solid #A9CDF0;border-radius:16px;padding:8px 4px;text-align:center}
.chips b{display:block;font-size:20px}.chips span{font-size:11px;color:#a07070}
.chips .c:nth-child(2){border-color:#F5B5C5}.chips .c:nth-child(3){border-color:#9ED9C0}
.panel{background:#fff;border:2.5px solid #F5B5C5;border-radius:24px;padding:14px;margin-bottom:14px;box-shadow:0 3px 0 #F5C9D4}
.ph{display:flex;align-items:center;justify-content:space-between}.ph h3{margin:0;font-size:18px}
.tg{display:flex;background:#FFEFF3;border-radius:14px;padding:3px}.tg button{font-size:12px;padding:3px 9px;border-radius:11px;font-weight:700;border:0;background:none;color:#5a3a3a}.tg .on{background:#F27C97;color:#fff}
.addw{display:block;width:100%;margin-top:10px;text-align:center;background:#EEF6FF;border:2px dashed #A9CDF0;border-radius:16px;padding:8px;font-weight:900;color:#4b85c0;font-size:15px}
.empty{text-align:center;color:#a07070;font-size:13px;padding:18px 6px}
.strip{display:flex;justify-content:space-between;margin-top:6px}.d{text-align:center;font-size:11px;color:#a07070}.d i{display:block;width:30px;height:30px;border-radius:50%;margin:3px auto 0;line-height:30px;font-style:normal;font-size:13px;font-weight:900;background:#F3EDE4;color:#c9b3b3}
.d .push{background:#FFD3DD;color:#d4506f}.d .pull{background:#DCEBFB;color:#4b85c0}.d .legs{background:#CFF0E2;color:#3d9a74}
h2{font-size:18px;margin:18px 4px 10px}
.s{background:#fff;border:2.5px solid #EADFD3;border-radius:20px;padding:12px;margin-bottom:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;cursor:pointer}
.pill{font-weight:900;font-size:16px;width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.pill.push{background:#FFD3DD;color:#d4506f}.pill.pull{background:#DCEBFB;color:#4b85c0}.pill.legs{background:#CFF0E2;color:#3d9a74}
.s .m{flex:1;min-width:0}.s .m b{font-size:15px}.s .m div{font-size:12px;color:#a07070;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cnt{font-weight:900;font-size:15px}.cnt small{font-size:11px;color:#a07070}
.s.exp{border-color:#F5B5C5}.det{width:100%;border-top:2px dashed #F5D3DC;margin-top:4px;padding-top:8px;display:none}.s.exp .det{display:block}
.e{display:flex;align-items:center;gap:10px;padding:4px 0}.e img{width:48px;height:48px;border-radius:12px;border:2px solid #FFE3EA;flex:none}.e b{font-size:14px;width:76px;flex:none}.e span{display:inline-block;font-size:12px;background:#FFF5F7;border-radius:8px;padding:2px 6px;margin:1px 3px 1px 0}
.note{font-size:12px;color:#a07070;margin-top:4px}
</style>
</head>
<body>
<div class="wrap" id="main">
  <button class="bearbtn" id="bearBtn" aria-label="历史打卡"><img src="assets/bear.webp" alt="小熊"></button>
  <h1>增肌打卡</h1>
  <button class="chip" id="pfChip" type="button"><span id="pfText"></span></button>
  <div class="suggest" id="suggest"></div>
  <div class="tabs" id="tabs">
    <button class="tab" data-day="push">推</button><button class="tab" data-day="pull">拉</button><button class="tab" data-day="legs">腿</button>
  </div>
  <div class="prog"><i id="progBar"></i><span id="progText">今日进度 0/15 组</span></div>
  <div id="cards"></div>
  <button class="btn" id="doneBtn">完成今天训练！</button>
</div>

<div class="wrap" id="hist">
  <div class="top"><button class="back" id="backBtn" aria-label="返回">‹</button><h1>历史打卡</h1><div class="hb"><img src="assets/bear.webp" alt=""></div></div>
  <div class="chips"><div class="c"><b id="stSess">0</b><span>累计训练</span></div><div class="c"><b id="stSets">0</b><span>完成组数</span></div><div class="c"><b id="stW">—</b><span>体重变化</span></div></div>
  <div class="panel"><div class="ph"><h3>体重变化</h3><div class="tg" id="wRange"><button data-r="7">7天</button><button data-r="30" class="on">30天</button><button data-r="all">全部</button></div></div>
    <div id="chart"></div>
    <button class="addw" id="addW">＋ 记录体重</button></div>
  <div class="panel" style="border-color:#B5D3F2;box-shadow:0 3px 0 #C9DEF5"><div class="ph"><h3>训练日</h3><span style="font-size:12px;color:#a07070" id="stripRange"></span></div>
    <div class="strip" id="strip"></div></div>
  <h2>训练记录</h2><div id="sessions"></div>
</div>

<div class="modal" id="musModal"><div class="box"><button class="x" data-close>×</button><h3 id="musTitle"></h3><img id="musImg" alt="发力肌群">
  <div class="lg"><span><i style="background:#E8504F"></i>主要</span><span><i style="background:#F8A866"></i>次要</span></div></div></div>

<div class="modal" id="pfMask" role="dialog" aria-modal="true"><div class="box form">
  <h3>编辑身体信息</h3>
  <label>身高 (cm，100–250)</label><input id="pfH" type="number" inputmode="decimal" step="0.1">
  <label>体重 (kg，30–250)</label><input id="pfW" type="number" inputmode="decimal" step="0.1">
  <label>训练水平</label><select id="pfLvSel"><option>新手</option><option>进阶</option><option>熟练</option><option value="__c">自定义…</option></select>
  <input id="pfLvCustom" type="text" maxlength="12" placeholder="输入自定义水平" style="display:none;margin-top:8px">
  <div class="err" id="pfErr"></div>
  <div class="act"><button type="button" id="pfCancel">取消</button><button type="button" class="pri" id="pfSave">保存</button></div>
</div></div>

<div class="modal" id="wModal"><div class="box form">
  <h3>记录体重</h3>
  <label>日期</label><input id="wDate" type="date">
  <label>体重 (kg)</label><input id="wKg" type="number" inputmode="decimal" step="0.1">
  <div class="err" id="wErr"></div>
  <div class="act"><button type="button" data-close>取消</button><button type="button" class="pri" id="wSave">保存</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
/* 增肌打卡 · Haolin — 本机 localStorage，无后端 */
var STORAGE_KEY = "haolin_workout_v1";   // 训练数据（沿用旧格式）
var PROFILE_KEY = "workoutProfile_v1";   // 身体信息
var WEIGHT_KEY = "weightLog_v1";         // 体重记录 [{date,kg}]
var DAY_SHORT = { push: "推", pull: "拉", legs: "腿" };
var NEXT_DAY = { push: "pull", pull: "legs", legs: "push" };
var A = "assets/";
function ex(id, name, sets, reps, img, mus) { return { id: id, name: name, sets: sets, reps: reps, img: img, mus: mus || img }; }
var PLAN = {
  push: [ex("bench","杠铃卧推",3,"8–10","push-01-bench"), ex("ohp","哑铃肩推",3,"8–10","push-02-shoulder-press"), ex("fly","器械夹胸",3,"10–12","push-03-chest-fly"), ex("lateral","侧平举",3,"12–15","push-04-lateral-raise"), ex("pushdown","绳索下压",3,"10–12","push-05-pushdown")],
  pull: [ex("latpulldown","高位下拉",3,"8–10","pull-01-lat-pulldown"), ex("seatedrow","坐姿划船",3,"8–10","pull-02-seated-row"), ex("tbar","胸托T杠划船",3,"8–10","pull-03-tbar-row","pull-02-seated-row"), ex("facecpull","面拉",3,"12–15","pull-04-face-pull"), ex("curl","哑铃弯举",3,"10–12","pull-05-curl")],
  legs: [ex("squat","深蹲/腿举",3,"8–10","legs-01-squat"), ex("rdl","罗马尼亚硬拉",3,"8–10","legs-02-rdl"), ex("legcurl","腿弯举",3,"10–12","legs-03-leg-curl"), ex("legext","腿伸展",3,"10–12","legs-04-leg-extension"), ex("core","卷腹",3,"15–20","legs-05-crunch")]
};
var EX_BY_ID = {}; Object.keys(PLAN).forEach(function (d) { PLAN[d].forEach(function (e) { EX_BY_ID[e.id] = e; }); });

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function pad(n) { return String(n).padStart(2, "0"); }
function dateKey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function todayKey() { return dateKey(new Date()); }
function md(k) { var p = String(k).split("-"); return +p[1] + "/" + +p[2]; }
function toast(t) { var el = $("toast"); el.textContent = t; el.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(function () { el.style.display = "none"; }, 2600); }

/* ---------- state (兼容旧数据) ---------- */
function loadState() {
  var s = null;
  try { s = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) {}
  if (!s || typeof s !== "object") s = {};
  if (!Array.isArray(s.history)) s.history = [];
  if (!("lastCompletedDay" in s)) s.lastCompletedDay = null;
  if (!("today" in s)) s.today = null;
  s.history = s.history.filter(function (h) { return h && h.date; }).map(normSession);
  if (s.today) s.today = normSession(s.today);
  return s;
}
function normSession(h) {
  if (!PLAN[h.dayType]) h.dayType = "push";
  if (!Array.isArray(h.exercises)) h.exercises = [];
  h.exercises = h.exercises.filter(Boolean).map(function (e) {
    var sets = Array.isArray(e.sets) ? e.sets : [];
    return Object.assign({}, e, { sets: sets.map(function (x) { x = x || {}; return Object.assign({}, x, { done: !!x.done, weight: x.weight == null ? "" : String(x.weight), reps: x.reps == null ? "" : String(x.reps) }); }) });
  });
  return h;
}
function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function emptySession(day) {
  return { date: todayKey(), dayType: day, note: "", completedAt: null,
    exercises: PLAN[day].map(function (e) { return { id: e.id, sets: Array.from({ length: e.sets }, function () { return { done: false, weight: "", reps: "" }; }) }; }) };
}
var state = loadState();
var curDay = "push";

function suggestedDay() { return NEXT_DAY[state.lastCompletedDay] || "push"; }
function ensureToday(day) {
  var t = state.today;
  if (!t || t.date !== todayKey() || t.dayType !== day) {
    // 若今天已完成过这一类型，从历史恢复以便修改
    var h = state.history.find(function (x) { return x.date === todayKey() && x.dayType === day; });
    state.today = h ? normSession(JSON.parse(JSON.stringify(h))) : emptySession(day);
  }
  // 与计划对齐（旧 id 保留数据）
  var byId = {}; state.today.exercises.forEach(function (e) { byId[e.id] = e; });
  state.today.exercises = PLAN[day].map(function (d) {
    var e = byId[d.id] || { id: d.id, sets: [] };
    while (e.sets.length < d.sets) e.sets.push({ done: false, weight: "", reps: "" });
    return e;
  });
  saveState();
}

/* ---------- main UI ---------- */
function progress() {
  var done = 0, total = 0;
  if (state.today) state.today.exercises.forEach(function (e) { e.sets.forEach(function (s) { total++; if (s.done) done++; }); });
  return { done: done, total: total };
}
function updateProgress() {
  var p = progress();
  $("progText").textContent = "今日进度 " + p.done + "/" + p.total + " 组";
  $("progBar").style.width = (p.total ? p.done / p.total * 100 : 0) + "%";
}
function updateSuggest() {
  var s = suggestedDay();
  $("suggest").textContent = state.lastCompletedDay ? "上次练「" + DAY_SHORT[state.lastCompletedDay] + "」，今天建议练「" + DAY_SHORT[s] + "」💪" : "第一次打卡，从「推」开始吧 💪";
}
function renderTabs() {
  var sug = suggestedDay();
  [].forEach.call(document.querySelectorAll(".tab"), function (b) {
    var d = b.dataset.day; b.classList.toggle("on", d === curDay);
    b.textContent = DAY_SHORT[d] + (d === curDay ? " 💪" : "") + (d === sug && d !== curDay ? " ·荐" : "");
  });
}
function renderCards() {
  var html = PLAN[curDay].map(function (d, i) {
    var e = state.today.exercises[i];
    var rows = e.sets.map(function (s, j) {
      return '<div class="set"><button class="ck' + (s.done ? " on" : "") + '" data-ck="' + i + "," + j + '" aria-label="完成第' + (j + 1) + '组">' + (s.done ? "✓" : "") + '</button>组 ' + (j + 1) +
        '<input class="in" inputmode="decimal" placeholder=" " data-f="weight" data-ij="' + i + "," + j + '" value="' + esc(s.weight) + '">kg ×' +
        '<input class="in" inputmode="numeric" placeholder=" " data-f="reps" data-ij="' + i + "," + j + '" value="' + esc(s.reps) + '">次</div>';
    }).join("");
    return '<div class="card"><h3>' + d.name + "<small>" + d.sets + "×" + d.reps + '</small></h3><div class="row"><button class="img" data-mus="' + i + '" aria-label="查看发力肌群"><img src="' + A + d.img + '-action.webp" alt="' + d.name + '" loading="lazy"></button><div class="sets">' + rows + "</div></div></div>";
  }).join("");
  $("cards").innerHTML = html;
}
function selectDay(day) { curDay = day; ensureToday(day); renderTabs(); renderCards(); updateProgress(); }

$("tabs").addEventListener("click", function (ev) { var b = ev.target.closest(".tab"); if (b) selectDay(b.dataset.day); });
$("cards").addEventListener("click", function (ev) {
  var c = ev.target.closest("[data-ck]");
  if (c) { var ij = c.dataset.ck.split(","), s = state.today.exercises[ij[0]].sets[ij[1]]; s.done = !s.done; c.classList.toggle("on", s.done); c.textContent = s.done ? "✓" : ""; saveState(); updateProgress(); return; }
  var m = ev.target.closest("[data-mus]");
  if (m) openMuscle(PLAN[curDay][m.dataset.mus]);
});
$("cards").addEventListener("input", function (ev) {
  var t = ev.target; if (!t.dataset.ij) return;
  var ij = t.dataset.ij.split(","), s = state.today.exercises[ij[0]].sets[ij[1]];
  s[t.dataset.f] = t.value.trim();
  if (s.weight && s.reps && !s.done) { s.done = true; var ck = t.parentNode.querySelector(".ck"); ck.classList.add("on"); ck.textContent = "✓"; updateProgress(); }
  saveState();
});
function openMuscle(d) { $("musTitle").textContent = d.name + " · 发力肌群"; $("musImg").src = A + d.mus + "-muscle.webp"; $("musModal").classList.add("on"); }
[].forEach.call(document.querySelectorAll(".modal"), function (m) {
  m.addEventListener("click", function (ev) { if (ev.target === m || ev.target.closest("[data-close]")) m.classList.remove("on"); });
});
$("doneBtn").onclick = function () {
  var p = progress();
  if (!p.done) { toast("还没有勾选任何一组，先打卡再完成吧～"); return; }
  state.today.completedAt = new Date().toISOString();
  state.lastCompletedDay = state.today.dayType;
  var snap = JSON.parse(JSON.stringify(state.today));
  state.history = state.history.filter(function (h) { return !(h.date === snap.date && h.dayType === snap.dayType); });
  state.history.unshift(snap);
  state.history.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
  if (state.history.length > 365) state.history = state.history.slice(0, 365);
  saveState(); updateSuggest(); renderTabs();
  toast("已保存！完成 " + p.done + "/" + p.total + " 组，下次建议练「" + DAY_SHORT[suggestedDay()] + "」");
};

/* ---------- profile ---------- */
var PD = { h: 187, w: 75, lv: "新手" };
function loadProfile() { try { var p = JSON.parse(localStorage.getItem(PROFILE_KEY)); if (p && p.h && p.w && p.lv) return p; } catch (e) {} return PD; }
function f1(n) { return String(Math.round(n * 10) / 10); }
function renderProfile() { var p = loadProfile(), b = p.w / Math.pow(p.h / 100, 2); $("pfText").innerHTML = f1(p.h) + "cm · " + f1(p.w) + "kg · " + esc(p.lv) + ' ✏️<span class="pf-bmi">BMI ' + b.toFixed(1) + "</span>"; }
$("pfChip").onclick = function () {
  var p = loadProfile(); $("pfH").value = p.h; $("pfW").value = p.w;
  var std = ["新手", "进阶", "熟练"].indexOf(p.lv) >= 0;
  $("pfLvSel").value = std ? p.lv : "__c"; $("pfLvCustom").value = std ? "" : p.lv; $("pfLvCustom").style.display = std ? "none" : "block";
  $("pfErr").textContent = ""; $("pfMask").classList.add("on");
};
$("pfCancel").onclick = function () { $("pfMask").classList.remove("on"); };
$("pfLvSel").onchange = function () { $("pfLvCustom").style.display = this.value === "__c" ? "block" : "none"; };
$("pfSave").onclick = function () {
  var h = parseFloat($("pfH").value), w = parseFloat($("pfW").value), lv = $("pfLvSel").value === "__c" ? $("pfLvCustom").value.trim() : $("pfLvSel").value;
  if (!(h >= 100 && h <= 250)) return ($("pfErr").textContent = "身高请填 100–250 cm");
  if (!(w >= 30 && w <= 250)) return ($("pfErr").textContent = "体重请填 30–250 kg");
  if (!lv) return ($("pfErr").textContent = "请填写训练水平");
  var old = loadProfile();
  localStorage.setItem(PROFILE_KEY, JSON.stringify({ h: h, w: w, lv: lv }));
  if (w !== old.w) addWeight(todayKey(), w);
  renderProfile(); $("pfMask").classList.remove("on");
};

/* ---------- weight log ---------- */
function loadWeights() {
  var a; try { a = JSON.parse(localStorage.getItem(WEIGHT_KEY)); } catch (e) {}
  if (!Array.isArray(a)) a = [];
  return a.filter(function (x) { return x && /^\d{4}-\d{2}-\d{2}$/.test(x.date) && x.kg > 0; }).sort(function (a, b) { return a.date < b.date ? -1 : 1; });
}
function addWeight(date, kg) {
  var a = loadWeights().filter(function (x) { return x.date !== date; });
  a.push({ date: date, kg: Math.round(kg * 10) / 10 });
  a.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  localStorage.setItem(WEIGHT_KEY, JSON.stringify(a));
}
var wRange = "30";
$("wRange").addEventListener("click", function (ev) { var b = ev.target.closest("button"); if (!b) return; wRange = b.dataset.r; [].forEach.call(this.children, function (c) { c.classList.toggle("on", c === b); }); renderChart(); });
$("addW").onclick = function () { $("wDate").value = todayKey(); $("wKg").value = loadProfile().w; $("wErr").textContent = ""; $("wModal").classList.add("on"); };
$("wSave").onclick = function () {
  var d = $("wDate").value, kg = parseFloat($("wKg").value);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return ($("wErr").textContent = "请选择日期");
  if (!(kg >= 30 && kg <= 250)) return ($("wErr").textContent = "体重请填 30–250 kg");
  addWeight(d, kg);
  var w = loadWeights();
  if (w[w.length - 1].date === d) { var p = loadProfile(); localStorage.setItem(PROFILE_KEY, JSON.stringify({ h: p.h, w: Math.round(kg * 10) / 10, lv: p.lv })); renderProfile(); }
  $("wModal").classList.remove("on"); renderHistory();
};
function renderChart() {
  var all = loadWeights(), pts = all;
  if (wRange !== "all") { var c = new Date(); c.setDate(c.getDate() - (+wRange - 1)); var ck = dateKey(c); pts = all.filter(function (x) { return x.date >= ck; }); }
  if (!pts.length) { $("chart").innerHTML = '<div class="empty">' + (all.length ? "这段时间还没有体重记录" : "还没有体重记录，点下面记一笔吧 🐻") + "</div>"; return; }
  var W = 354, H = 170, x0 = 40, x1 = 330, y0 = 24, y1 = 136;
  var ks = pts.map(function (p) { return p.kg; }), mn = Math.min.apply(0, ks), mx = Math.max.apply(0, ks);
  if (mx - mn < 1) { var m = (mx + mn) / 2; mn = m - 0.5; mx = m + 0.5; }
  var t0 = new Date(pts[0].date).getTime(), t1 = new Date(pts[pts.length - 1].date).getTime();
  function X(p, i) { return pts.length === 1 ? (x0 + x1) / 2 : t1 === t0 ? x0 + (x1 - x0) * i / (pts.length - 1) : x0 + (x1 - x0) * (new Date(p.date).getTime() - t0) / (t1 - t0); }
  function Y(k) { return y1 - (y1 - y0) * (k - mn) / (mx - mn); }
  var xy = pts.map(function (p, i) { return [X(p, i).toFixed(1), Y(p.kg).toFixed(1)]; });
  var s = '<svg width="100%" viewBox="0 0 ' + W + " " + H + '" style="margin-top:8px;display:block">';
  s += '<g stroke="#F3E6DA" stroke-dasharray="4 4">';
  var lab = "";
  [0, 0.5, 1].forEach(function (f) { var v = mn + (mx - mn) * f, y = Y(v); s += '<line x1="36" y1="' + y + '" x2="346" y2="' + y + '"/>'; lab += '<text x="2" y="' + (y + 4) + '">' + v.toFixed(1) + "</text>"; });
  s += "</g>";
  var idx = pts.length <= 5 ? pts.map(function (_, i) { return i; }) : [0, 1, 2, 3, 4].map(function (k) { return Math.round(k * (pts.length - 1) / 4); });
  idx.forEach(function (i) { lab += '<text x="' + xy[i][0] + '" y="160" text-anchor="middle">' + md(pts[i].date) + "</text>"; });
  s += '<g font-size="11" fill="#a07070">' + lab + "</g>";
  var line = xy.map(function (p) { return p.join(","); }).join(" ");
  if (pts.length > 1) s += '<path d="M' + xy.map(function (p) { return p.join(" "); }).join(" L") + " L" + xy[xy.length - 1][0] + " " + y1 + " L" + xy[0][0] + " " + y1 + 'Z" fill="#FFD9E2" opacity=".55"/><polyline points="' + line + '" fill="none" stroke="#F27C97" stroke-width="3" stroke-linejoin="round"/>';
  s += '<g fill="#fff" stroke="#F27C97" stroke-width="2.5">' + xy.map(function (p, i) { return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="' + (i === xy.length - 1 ? 5 : 4) + '"/>'; }).join("") + "</g>";
  var lx = Math.min(Math.max(+xy[xy.length - 1][0] - 30, 0), W - 64), ly = Math.max(+xy[xy.length - 1][1] - 30, 0);
  s += '<rect x="' + lx + '" y="' + ly + '" width="62" height="22" rx="11" fill="#F27C97"/><text x="' + (lx + 31) + '" y="' + (ly + 15) + '" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">' + pts[pts.length - 1].kg.toFixed(1) + "kg</text></svg>";
  $("chart").innerHTML = s;
}

/* ---------- history ---------- */
var WEEK = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
function dObj(k) { var p = k.split("-"); return new Date(+p[0], p[1] - 1, +p[2]); }
function doneSets(h) { var n = 0; h.exercises.forEach(function (e) { e.sets.forEach(function (s) { if (s.done) n++; }); }); return n; }
function totalSets(h) { var n = 0; h.exercises.forEach(function (e) { n += e.sets.length; }); return n || 15; }
function setText(s) { if (s.weight && s.reps) return s.weight + "×" + s.reps; if (s.weight) return s.weight + "kg"; if (s.reps) return s.reps + "次"; return "✓"; }
function best(h) {
  var b = null;
  h.exercises.forEach(function (e) { e.sets.forEach(function (s) { var w = parseFloat(s.weight); if (s.done && w > 0 && (!b || w > b.w)) b = { w: w, r: s.reps, id: e.id }; }); });
  if (!b) return "完成 " + doneSets(h) + " 组";
  return "最佳 " + ((EX_BY_ID[b.id] || {}).name || b.id) + " " + b.w + "kg" + (b.r ? " × " + b.r : "");
}
function renderHistory() {
  var H = state.history;
  $("stSess").textContent = H.length;
  $("stSets").textContent = H.reduce(function (a, h) { return a + doneSets(h); }, 0);
  var w = loadWeights();
  if (w.length >= 2) { var d = w[w.length - 1].kg - w[0].kg; $("stW").textContent = (d > 0 ? "+" : d < 0 ? "−" : "±") + Math.abs(d).toFixed(1) + "kg"; } else $("stW").textContent = w.length ? "±0kg" : "—";
  renderChart();
  // 训练日 strip: 最近 7 个训练日
  var days = H.slice(0, 7).reverse();
  if (!days.length) { $("strip").innerHTML = '<div class="empty" style="width:100%">还没有训练记录，今天就开练吧！</div>'; $("stripRange").textContent = ""; }
  else {
    $("strip").innerHTML = days.map(function (h) { return '<div class="d">' + md(h.date) + '<i class="' + h.dayType + '">' + DAY_SHORT[h.dayType] + "</i></div>"; }).join("");
    $("stripRange").textContent = md(days[0].date) + (days.length > 1 ? " – " + md(days[days.length - 1].date) : "");
  }
  if (!H.length) { $("sessions").innerHTML = '<div class="empty">完成一次训练后，记录会出现在这里 🐻</div>'; return; }
  $("sessions").innerHTML = H.map(function (h, k) {
    var det = h.exercises.map(function (e) {
      var d = EX_BY_ID[e.id], done = e.sets.filter(function (s) { return s.done || s.weight || s.reps; });
      if (!done.length) return "";
      return '<div class="e">' + (d ? '<img src="' + A + d.img + '-action.webp" alt="" loading="lazy">' : "") + "<b>" + esc(d ? d.name : e.id) + "</b><div>" + done.map(function (s) { return "<span>" + esc(setText(s)) + "</span>"; }).join("") + "</div></div>";
    }).join("");
    return '<div class="s' + (k === 0 ? " exp" : "") + '" data-k="' + k + '"><div class="pill ' + h.dayType + '">' + DAY_SHORT[h.dayType] + '</div><div class="m"><b>' + md(h.date) + " " + WEEK[dObj(h.date).getDay()] + "</b><div>" + esc(best(h)) + '</div></div><div class="cnt">' + doneSets(h) + "<small>/" + totalSets(h) + ' 组</small> <span class="ar">' + (k === 0 ? "▲" : "▼") + '</span></div><div class="det">' + (det || '<div class="note">没有记录具体组数</div>') + (h.note ? '<div class="note">📝 ' + esc(h.note) + "</div>" : "") + '<div class="note" style="text-align:right">单位：kg × 次</div></div></div>';
  }).join("");
}
$("sessions").addEventListener("click", function (ev) { var c = ev.target.closest(".s"); if (!c) return; var on = c.classList.toggle("exp"); c.querySelector(".ar").textContent = on ? "▲" : "▼"; });
function showHist(on) { document.body.classList.toggle("histmode", on); if (on) renderHistory(); window.scrollTo(0, 0); }
$("bearBtn").onclick = function () { location.hash = "history"; };
$("backBtn").onclick = function () { if (location.hash === "#history") history.back(); else showHist(false); };
window.addEventListener("hashchange", function () { showHist(location.hash === "#history"); });

/* ---------- init ---------- */
renderProfile(); updateSuggest();
selectDay(state.today && state.today.date === todayKey() ? state.today.dayType : suggestedDay());
if (location.hash === "#history") showHist(true);
</script>
</body>
</html>
