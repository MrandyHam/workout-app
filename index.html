<title>增肌打卡 · Haolin</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#FFF8E8;font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;color:#5a3a3a}
.wrap{max-width:480px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom));position:relative}
button{font-family:inherit;cursor:pointer}
h1{font-size:40px;margin:14px 0 8px;color:#F27C97;letter-spacing:2px;text-shadow:3px 3px 0 #fff,-2px -2px 0 #fff;font-weight:900}
.bearbtn{position:absolute;right:12px;top:calc(8px + env(safe-area-inset-top));width:112px;height:112px;display:flex;align-items:center;justify-content:center;background:none;border:0;padding:0}
.bearbtn img{width:104px}
.chip{display:inline-block;background:#EAF4FF;border:2px solid #A9CDF0;border-radius:20px;padding:6px 12px;font-size:13px;font-weight:700;color:#5a3a3a}
.pf-bmi{margin-left:8px}
.suggest{font-size:12px;color:#a07070;margin-top:8px;min-height:16px}
.tabs{display:flex;gap:10px;margin:14px 0 14px}.tab{flex:1;text-align:center;padding:10px;border-radius:22px;font-size:20px;font-weight:900;background:#DCEBFB;border:2px solid #A9CDF0;color:#5a3a3a}
.tab.on{background:#FFD3DD;border-color:#F27C97;color:#d4506f}
.prog{border:2px solid #9ED9C0;border-radius:18px;background:#fff;height:30px;position:relative;overflow:hidden;margin-bottom:16px}
.prog i{position:absolute;left:0;top:0;bottom:0;width:0;background:#A8E4CC;transition:width .3s}.prog span{position:absolute;width:100%;text-align:center;line-height:26px;font-size:14px;font-weight:700}
.card{background:#FFEFF3;border:2.5px solid #F5B5C5;border-radius:24px;padding:12px;margin-bottom:14px;box-shadow:0 3px 0 #F5C9D4}
.card:nth-child(even){background:#EEF6FF;border-color:#B5D3F2;box-shadow:0 3px 0 #C9DEF5}
.card h3{margin:2px 4px 10px;font-size:19px}.card h3 small{font-size:14px;color:#a07070;margin-left:6px}
.row{display:flex;gap:10px}.img{width:118px;height:118px;flex:none;border-radius:18px;overflow:hidden;border:2px solid #fff;padding:0;background:#fff}
.img img{width:100%;height:100%;display:block}
.sets{flex:1;background:#fff;border-radius:16px;padding:8px;display:flex;flex-direction:column;justify-content:space-around;gap:4px;min-width:0}
.set{display:flex;align-items:center;gap:4px;white-space:nowrap;font-size:13px;font-weight:700}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid #F27C97;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;background:#fff;color:#fff;padding:0}
.ck.on{background:#F27C97}
.in.cv{width:64px}.un{height:30px;min-width:44px;border:1.5px solid #F27C97;border-radius:8px;background:#fff;color:#F27C97;font-weight:900;font-size:14px;font-family:inherit;padding:0 6px}
.addrow{border:0;background:none;color:#e0a0a0;font-weight:700;font-size:13px;padding:4px 0;font-family:inherit;align-self:flex-start}

.in:not(:placeholder-shown){border:1.5px solid #F27C97;background:#FFF5F7}
.in:focus{outline:none;border-color:#F27C97}
.btn{display:block;width:100%;margin-top:8px;background:#7FD3B0;border:3px solid #fff;box-shadow:0 0 0 2.5px #5DBB95;border-radius:30px;text-align:center;color:#fff;font-size:24px;font-weight:900;padding:14px}
.modal{position:fixed;inset:0;background:rgba(90,58,58,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.on{display:flex}.box{width:100%;max-width:340px;background:#FFF8E8;border:3px solid #F5B5C5;border-radius:28px;padding:16px;position:relative;text-align:center}
.box h3{margin:4px 30px 10px;font-size:20px}
.box>img{width:100%;border-radius:18px;display:block}.x{position:absolute;right:12px;top:10px;width:32px;height:32px;border-radius:50%;background:#FFD3DD;font-size:20px;line-height:32px;font-weight:900;color:#d4506f;border:0;padding:0}
.lg{display:flex;justify-content:center;gap:20px;font-size:15px;font-weight:700;margin-top:10px}.lg i{display:inline-block;width:16px;height:16px;border-radius:5px;vertical-align:-2px;margin-right:5px}
.form{text-align:left}.form label{display:block;font-size:13px;font-weight:700;margin:10px 0 4px}
.form input,.form select{width:100%;height:40px;border:2px solid #F5B5C5;border-radius:12px;padding:0 10px;font-size:16px;background:#fff;color:#5a3a3a;font-family:inherit}
.err{color:#d4506f;font-size:13px;min-height:18px;margin-top:6px}
.act{display:flex;gap:10px;margin-top:8px}.act button{flex:1;height:42px;border-radius:21px;font-size:16px;font-weight:900;border:2px solid #F5B5C5;background:#fff;color:#d4506f}
.act button.pri{background:#F27C97;border-color:#F27C97;color:#fff}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#5a3a3a;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;display:none;z-index:60;max-width:90%;text-align:center}
/* history */
#hist{display:none}.histmode #main{display:none}.histmode #hist{display:block}
.top{display:flex;align-items:center;gap:10px}
.back{width:40px;height:40px;border-radius:50%;background:#fff;border:2px solid #F5B5C5;font-size:22px;font-weight:900;color:#d4506f;display:flex;align-items:center;justify-content:center;padding:0}
.top h1{flex:1;font-size:30px;margin:0}
.hb{width:78px;height:78px;display:flex;align-items:center;justify-content:center}.hb img{width:72px}
.chips{display:flex;gap:8px;margin:16px 0}.chips .c{flex:1;background:#fff;border:2px solid #A9CDF0;border-radius:16px;padding:8px 4px;text-align:center}
.chips b{display:block;font-size:20px}.chips span{font-size:11px;color:#a07070}
.chips .c:nth-child(2){border-color:#F5B5C5}.chips .c:nth-child(3){border-color:#9ED9C0}
.panel{background:#fff;border:2.5px solid #F5B5C5;border-radius:24px;padding:14px;margin-bottom:14px;box-shadow:0 3px 0 #F5C9D4}
.ph{display:flex;align-items:center;justify-content:space-between}.ph h3{margin:0;font-size:18px}
.tg{display:flex;background:#FFEFF3;border-radius:14px;padding:3px}.tg button{font-size:12px;padding:3px 9px;border-radius:11px;font-weight:700;border:0;background:none;color:#5a3a3a}.tg .on{background:#F27C97;color:#fff}
.addw{display:block;width:100%;margin-top:10px;text-align:center;background:#EEF6FF;border:2px dashed #A9CDF0;border-radius:16px;padding:8px;font-weight:900;color:#4b85c0;font-size:15px}
.empty{text-align:center;color:#a07070;font-size:13px;padding:18px 6px}
.strip{display:flex;justify-content:space-between;margin-top:6px}.d{text-align:center;font-size:11px;color:#a07070}.d i{display:block;width:30px;height:30px;border-radius:50%;margin:3px auto 0;line-height:30px;font-style:normal;font-size:13px;font-weight:900;background:#F3EDE4;color:#c9b3b3}
.d .push{background:#FFD3DD;color:#d4506f}.d .pull{background:#DCEBFB;color:#4b85c0}.d .legs{background:#CFF0E2;color:#3d9a74}
h2{font-size:18px;margin:18px 4px 10px}
.s{background:#fff;border:2.5px solid #EADFD3;border-radius:20px;padding:12px;margin-bottom:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;cursor:pointer}
.pill{font-weight:900;font-size:16px;width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.pill.push{background:#FFD3DD;color:#d4506f}.pill.pull{background:#DCEBFB;color:#4b85c0}.pill.legs{background:#CFF0E2;color:#3d9a74}
.s .m{flex:1;min-width:0}.s .m b{font-size:15px}.s .m div{font-size:12px;color:#a07070;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cnt{font-weight:900;font-size:15px}.cnt small{font-size:11px;color:#a07070}
.s.exp{border-color:#F5B5C5}.det{width:100%;border-top:2px dashed #F5D3DC;margin-top:4px;padding-top:8px;display:none}.s.exp .det{display:block}
.e{display:flex;align-items:center;gap:10px;padding:4px 0}.e img{width:48px;height:48px;border-radius:12px;border:2px solid #FFE3EA;flex:none}.e b{font-size:14px;width:76px;flex:none}.e span{display:inline-block;font-size:12px;background:#FFF5F7;border-radius:8px;padding:2px 6px;margin:1px 3px 1px 0}
.note{font-size:12px;color:#a07070;margin-top:4px}
.kc{display:flex;align-items:center;justify-content:center;gap:6px;margin:-8px 0 14px;font-size:14px;font-weight:900;color:#e0794f}
.cf{height:1.2em;width:1.2em;vertical-align:-0.25em;object-fit:contain}
.kc b{font-size:17px}.kci{width:20px;height:20px;border-radius:50%;border:0;background:rgba(255,255,255,.8);color:#c9a0a0;font-size:12px;font-weight:900;padding:0;line-height:20px}
.ek{font-style:normal;font-size:11px;color:#e0a080;margin-left:6px;font-weight:700}
.cnt .kk{display:block;font-size:11px;color:#e0794f;text-align:right}
.card{position:relative;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.card .in{-webkit-user-select:text;user-select:text}
.card.lift{z-index:20;transform:scale(1.04);box-shadow:0 14px 26px rgba(242,124,151,.35),0 3px 0 #F5C9D4;transition:transform .15s,box-shadow .15s}
.card.drag{transition:none}.card.shift{transition:transform .18s}
.dots{position:absolute;right:10px;top:8px;width:34px;height:26px;border-radius:13px;border:0;background:rgba(255,255,255,.55);color:rgba(150,110,110,.75);font-size:18px;font-weight:900;line-height:20px;padding:0;letter-spacing:1px}
.card h3{padding-right:40px}
.emenu{position:fixed;z-index:55;display:none;background:#fff;border:2.5px solid #F5B5C5;border-radius:18px;box-shadow:0 6px 16px rgba(90,58,58,.18);padding:6px;min-width:120px}
.emenu.on{display:block}.emenu button{display:block;width:100%;border:0;background:none;padding:10px 12px;border-radius:12px;font-size:16px;font-weight:900;color:#5a3a3a;text-align:left}
.emenu button:active{background:#FFEFF3}.emenu .del{color:#d4506f}
.addex{display:block;width:100%;margin:0 0 6px;background:rgba(255,255,255,.6);border:2.5px dashed #F5B5C5;border-radius:22px;padding:12px;font-size:17px;font-weight:900;color:#d4506f}
.reset{display:block;margin:18px auto 0;background:none;border:0;color:#c9b3b3;font-size:12px;text-decoration:underline}
.sheetm{align-items:flex-end;padding:0}.sheet{width:100%;max-width:480px;max-height:82vh;background:#FFF8E8;border:3px solid #F5B5C5;border-bottom:0;border-radius:28px 28px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;position:relative}
.sheet h3{margin:2px 40px 10px;text-align:center;font-size:20px}.sheet .tabs{margin:0 0 10px}.sheet .tab{font-size:17px;padding:7px}
.lib{overflow-y:auto;-webkit-overflow-scrolling:touch;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:2px 2px 6px}
.li{background:#fff;border:2.5px solid #F5D3DC;border-radius:20px;padding:8px;text-align:center;color:#5a3a3a}
.li img{width:100%;aspect-ratio:1;border-radius:14px;display:block}.li b{display:block;font-size:15px;margin-top:6px}.li small{font-size:12px;color:#a07070}
.li[disabled]{opacity:.4}
</style>
</head>
<body>
<div class="wrap" id="main">
  <button class="bearbtn" id="bearBtn" aria-label="历史打卡"><img src="assets/bear.webp" alt="小熊"></button>
  <h1>增肌打卡</h1>
  <button class="chip" id="pfChip" type="button"><span id="pfText"></span></button>
  <div class="suggest" id="suggest"></div>
  <div class="tabs" id="tabs">
    <button class="tab" data-day="push">推</button><button class="tab" data-day="pull">拉</button><button class="tab" data-day="legs">腿</button>
  </div>
  <div class="prog"><i id="progBar"></i><span id="progText">今日进度 0/15 组</span></div>
  <div class="kc"><img class="cf" src="assets/campfire.webp" alt=""> 约 <b id="kcal">0</b> kcal <button class="kci" id="kcInfo" aria-label="说明">ⓘ</button></div>
  <div id="cards"></div>
  <button class="btn" id="doneBtn">完成今天训练！</button>
  <button class="reset" id="resetBtn">恢复默认动作</button>
</div>

<div class="wrap" id="hist">
  <div class="top"><button class="back" id="backBtn" aria-label="返回">‹</button><h1>历史打卡</h1><div class="hb"><img src="assets/bear.webp" alt=""></div></div>
  <div class="chips"><div class="c"><b id="stSess">0</b><span>累计训练</span></div><div class="c"><b id="stSets">0</b><span>完成组数</span></div><div class="c"><b id="stW">—</b><span>体重变化</span></div></div>
  <div class="panel"><div class="ph"><h3>体重变化</h3><div class="tg" id="wRange"><button data-r="7">7天</button><button data-r="30" class="on">30天</button><button data-r="all">全部</button></div></div>
    <div id="chart"></div>
    <button class="addw" id="addW">＋ 记录体重</button></div>
  <div class="panel" style="border-color:#B5D3F2;box-shadow:0 3px 0 #C9DEF5"><div class="ph"><h3>训练日</h3><span style="font-size:12px;color:#a07070" id="stripRange"></span></div>
    <div class="strip" id="strip"></div></div>
  <h2>训练记录</h2><div id="sessions"></div>
</div>

<div class="modal" id="musModal"><div class="box"><button class="x" data-close>×</button><h3 id="musTitle"></h3><img id="musImg" alt="发力肌群">
  <div class="lg"><span><i style="background:#E8504F"></i>主要</span><span><i style="background:#F8A866"></i>次要</span></div></div></div>

<div class="modal" id="pfMask" role="dialog" aria-modal="true"><div class="box form">
  <h3>编辑身体信息</h3>
  <label>身高 (cm，100–250)</label><input id="pfH" type="number" inputmode="decimal" step="0.1">
  <label>体重 (kg，30–250)</label><input id="pfW" type="number" inputmode="decimal" step="0.1">
  <label>训练水平</label><select id="pfLvSel"><option>新手</option><option>进阶</option><option>熟练</option><option value="__c">自定义…</option></select>
  <input id="pfLvCustom" type="text" maxlength="12" placeholder="输入自定义水平" style="display:none;margin-top:8px">
  <div class="err" id="pfErr"></div>
  <div class="act"><button type="button" id="pfCancel">取消</button><button type="button" class="pri" id="pfSave">保存</button></div>
</div></div>

<div class="modal" id="wModal"><div class="box form">
  <h3>记录体重</h3>
  <label>日期</label><input id="wDate" type="date">
  <label>体重 (kg)</label><input id="wKg" type="number" inputmode="decimal" step="0.1">
  <div class="err" id="wErr"></div>
  <div class="act"><button type="button" data-close>取消</button><button type="button" class="pri" id="wSave">保存</button></div>
</div></div>
<div class="emenu" id="exMenu"><button id="mRep">🔄 替换</button><button class="del" id="mDel">🗑️ 删除</button></div>
<div class="modal sheetm" id="libModal"><div class="sheet"><button class="x" data-close>×</button><h3 id="libTitle">动作库</h3>
  <div class="tabs" id="libTabs"><button class="tab" data-g="push">推</button><button class="tab" data-g="pull">拉</button><button class="tab" data-g="legs">腿</button><button class="tab" data-g="cardio">有氧</button></div>
  <div class="lib" id="libList"></div></div></div>
<div class="modal" id="cfModal"><div class="box"><h3 id="cfText"></h3><div class="act"><button type="button" data-close>取消</button><button type="button" class="pri" id="cfOk">确定</button></div></div></div>
<div class="modal" id="kcModal"><div class="box"><button class="x" data-close>×</button><h3><img class="cf" src="assets/campfire.webp" alt=""> 卡路里是估算的</h3>
  <div style="text-align:left;font-size:14px;line-height:1.7">根据你的体重、勾选完成的组、重量和次数估算：<br>· 举起重量做的功 ÷ 肌肉效率 (约22%)<br>· 加上每组训练和组间休息的代谢消耗 (MET)<br>· 有氧：按距离 (跑步约 1 kcal/公斤/公里，骑车约 0.35) 或时间 (慢跑 7.0 / 骑车 6.8 MET) 估算<br>实际消耗因人而异，仅供参考，误差可能有 ±30% 哦～</div></div></div>
<div class="toast" id="toast"></div>

<script>
/* 增肌打卡 · Haolin — 本机 localStorage，无后端 */
var STORAGE_KEY = "haolin_workout_v1";   // 训练数据（沿用旧格式）
var PROFILE_KEY = "workoutProfile_v1";   // 身体信息
var WEIGHT_KEY = "weightLog_v1";         // 体重记录 [{date,kg}]
var DAY_SHORT = { push: "推", pull: "拉", legs: "腿" };
var NEXT_DAY = { push: "pull", pull: "legs", legs: "push" };
var A = "assets/";
function ex(id, name, sets, reps, img, mus) { return { id: id, name: name, sets: sets, reps: reps, img: img, mus: mus || img }; }
var PLAN = {
  push: [ex("bench","杠铃卧推",3,"8–10","push-01-bench"), ex("ohp","哑铃肩推",3,"8–10","push-02-shoulder-press"), ex("fly","器械夹胸",3,"10–12","push-03-chest-fly"), ex("lateral","侧平举",3,"12–15","push-04-lateral-raise"), ex("pushdown","绳索下压",3,"10–12","push-05-pushdown")],
  pull: [ex("latpulldown","高位下拉",3,"8–10","pull-01-lat-pulldown"), ex("seatedrow","坐姿划船",3,"8–10","pull-02-seated-row"), ex("tbar","胸托T杠划船",3,"8–10","pull-03-tbar-row","pull-02-seated-row"), ex("facecpull","面拉",3,"12–15","pull-04-face-pull"), ex("curl","哑铃弯举",3,"10–12","pull-05-curl")],
  legs: [ex("squat","深蹲/腿举",3,"8–10","legs-01-squat"), ex("rdl","罗马尼亚硬拉",3,"8–10","legs-02-rdl"), ex("legcurl","腿弯举",3,"10–12","legs-03-leg-curl"), ex("legext","腿伸展",3,"10–12","legs-04-leg-extension"), ex("core","卷腹",3,"15–20","legs-05-crunch")]
};
var EXTRA = {
  push: [ex("incline","上斜哑铃卧推",3,"10","push-incline-db-press"), ex("pushup","俯卧撑",3,"10–15","push-pushup"), ex("ohtri","哑铃颈后臂屈伸",3,"12","push-overhead-triceps")],
  pull: [ex("srow","单臂哑铃划船",3,"10/侧","pull-single-arm-row"), ex("hammer","锤式弯举",3,"12","pull-hammer-curl"), ex("reardelt","反向飞鸟",3,"15","pull-rear-delt-fly"), ex("shrug","哑铃耸肩",3,"15","pull-shrug")],
  legs: [ex("lunge","弓箭步",3,"10/侧","lunge"), ex("goblet","高脚杯深蹲",3,"10","legs-goblet-squat"), ex("hipthrust","臀推",3,"12","legs-hip-thrust"), ex("calf","站姿提踵",3,"15","legs-calf-raise")]
};
var CARDIO = [ex("jog","慢跑",1,"20–30 分钟","cardio-jog"), ex("cycle","骑单车",1,"20–40 分钟","cardio-cycle")];
CARDIO[0].cardio = "run"; CARDIO[1].cardio = "bike";
var EX_BY_ID = {}, LIB = {};
Object.keys(PLAN).forEach(function (d) { LIB[d] = PLAN[d].concat(EXTRA[d]); LIB[d].forEach(function (e) { e.g = d; EX_BY_ID[e.id] = e; }); });
LIB.cardio = CARDIO; CARDIO.forEach(function (e) { e.g = "cardio"; EX_BY_ID[e.id] = e; });
/* 有氧组：数值存在 weight 字段，单位存在 unit 字段 (min/km/m，默认 min) */
var UNITS = ["min", "km", "m"];
function isCardio(id) { return !!(EX_BY_ID[id] && EX_BY_ID[id].cardio); }
/* 每日动作列表（顺序/删除/替换/添加），按动作 id 保存 */
var PLAN_KEY = "workoutPlan_v1";
function defaultPlan() { var p = {}; Object.keys(PLAN).forEach(function (d) { p[d] = PLAN[d].map(function (e) { return e.id; }); }); return p; }
function loadPlan() {
  var p = null; try { p = JSON.parse(localStorage.getItem(PLAN_KEY)); } catch (e) {}
  var def = defaultPlan(); if (!p || typeof p !== "object") return def;
  Object.keys(def).forEach(function (d) { var a = Array.isArray(p[d]) ? p[d].filter(function (id, i, arr) { return EX_BY_ID[id] && arr.indexOf(id) === i; }) : null; p[d] = a || def[d]; });
  return p;
}
var plan = loadPlan();
function savePlan() { try { localStorage.setItem(PLAN_KEY, JSON.stringify(plan)); } catch (e) {} }
function curPlan(day) { return plan[day].map(function (id) { return EX_BY_ID[id]; }); }

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

function dateKey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function todayKey() { return dateKey(new Date()); }
function md(k) { var p = String(k).split("-"); return +p[1] + "/" + +p[2]; }
function toast(t) { var el = $("toast"); el.textContent = t; el.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(function () { el.style.display = "none"; }, 2600); }

/* ---------- state (兼容旧数据) ---------- */
function loadState() {
  var s = null;
  try { s = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) {}
  if (!s || typeof s !== "object") s = {};
  if (!Array.isArray(s.history)) s.history = [];
  if (!("lastCompletedDay" in s)) s.lastCompletedDay = null;
  if (!("today" in s)) s.today = null;
  s.history = s.history.filter(function (h) { return h && h.date; }).map(normSession);
  if (s.today) s.today = normSession(s.today);
  return s;
}
function normSession(h) {
  if (!PLAN[h.dayType]) h.dayType = "push";
  if (!Array.isArray(h.exercises)) h.exercises = [];
  h.exercises = h.exercises.filter(Boolean).map(function (e) {
    var sets = Array.isArray(e.sets) ? e.sets : [];
    return Object.assign({}, e, { sets: sets.map(function (x) { x = x || {}; return Object.assign({}, x, { done: !!x.done, weight: x.weight == null ? "" : String(x.weight), reps: x.reps == null ? "" : String(x.reps) }); }) });
  });
  return h;
}
var DRAFT_KEY = "workoutDraft_v1";      // 今日各训练日草稿 {date, days:{push,pull,legs}}
var LAST_SETS_KEY = "lastSets_v1";      // 各动作最近一次 kg×reps（按组，不含勾选）{id:[{weight,reps},...]}
function loadDraft() { var d = null; try { d = JSON.parse(localStorage.getItem(DRAFT_KEY)); } catch (e) {} if (!d || d.date !== todayKey() || typeof d.days !== "object" || !d.days) d = { date: todayKey(), days: {} }; return d; }
function saveDraft() { if (!state.today || state.today.date !== todayKey()) return; var d = loadDraft(); d.days[state.today.dayType] = state.today; try { localStorage.setItem(DRAFT_KEY, JSON.stringify(d)); } catch (e) {} }
function loadLastSets() { var o = null; try { o = JSON.parse(localStorage.getItem(LAST_SETS_KEY)); } catch (e) {} return o && typeof o === "object" ? o : {}; }
function saveLastSets(o) { try { localStorage.setItem(LAST_SETS_KEY, JSON.stringify(o || lastSets)); } catch (e) {} }
function rememberInto(store, exercises) {
  (exercises || []).forEach(function (e) {
    if (!e || !e.id || !Array.isArray(e.sets)) return;
    var rows = e.sets.map(function (s) { var r = { weight: s && s.weight != null ? String(s.weight) : "", reps: s && s.reps != null ? String(s.reps) : "" }; if (s && s.unit) r.unit = s.unit; return r; });
    if (!rows.some(function (r) { return r.weight || r.reps; })) return;
    var prev = store[e.id] || [];
    var merged = rows.map(function (r, i) {
      var o = { weight: r.weight || (prev[i] && prev[i].weight) || "", reps: r.reps || (prev[i] && prev[i].reps) || "" };
      var u = r.unit || (prev[i] && prev[i].unit); if (u) o.unit = u; return o;
    });
    if (prev.length > merged.length) merged = merged.concat(prev.slice(merged.length));
    store[e.id] = merged;
  });
}
function rememberSetsFrom(exercises) {
  (exercises || []).forEach(function (e) {
    if (!e || !e.id || !Array.isArray(e.sets)) return;
    var rows = e.sets.map(function (s) {
      var r = { weight: s && s.weight != null ? String(s.weight) : "", reps: s && s.reps != null ? String(s.reps) : "" };
      if (s && s.unit) r.unit = s.unit; return r;
    });
    var has = rows.some(function (r) { return r.weight || r.reps; });
    if (!has) { if (lastSets[e.id]) delete lastSets[e.id]; return; }
    lastSets[e.id] = rows;
  });
  saveLastSets();
}
function lastSetsFor(id, n) {
  var prev = lastSets[id] || [], out = [], i, c = isCardio(id);
  if (c && prev.length > n) n = Math.min(prev.length, 6);
  for (i = 0; i < n; i++) { var o = { weight: (prev[i] && prev[i].weight) || "", reps: (prev[i] && prev[i].reps) || "" }; if (c) o.unit = (prev[i] && prev[i].unit) || "min"; out.push(o); }
  return out;
}
function seedLastSets() {
  var o = loadLastSets();
  // 从历史（旧→新）和任意草稿（含隔日）灌入，已有 lastSets 的条目保留并被更新覆盖
  var hist = (state.history || []).slice().reverse();
  hist.forEach(function (h) { rememberInto(o, h.exercises); });
  try {
    var raw = JSON.parse(localStorage.getItem(DRAFT_KEY));
    if (raw && raw.days) Object.keys(raw.days).forEach(function (k) { if (raw.days[k]) rememberInto(o, raw.days[k].exercises); });
  } catch (e) {}
  if (state.today) rememberInto(o, state.today.exercises);
  lastSets = o; saveLastSets();
}
function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {} saveDraft(); if (state.today) rememberSetsFrom(state.today.exercises); }
function newSet(r) { var s = { done: false, weight: r.weight || "", reps: r.reps || "" }; if (r.unit) s.unit = r.unit; return s; }
function emptySession(day) {
  return { date: todayKey(), dayType: day, note: "", completedAt: null,
    exercises: curPlan(day).map(function (e) {
      return { id: e.id, sets: lastSetsFor(e.id, e.sets).map(function (r) { return newSet(r); }) };
    }) };
}
var state = loadState();
var lastSets = {};
seedLastSets();
var curDay = "push";

function suggestedDay() { return NEXT_DAY[state.lastCompletedDay] || "push"; }
function ensureToday(day) {
  var t = state.today;
  if (!t || t.date !== todayKey() || t.dayType !== day) {
    // 若今天已完成过这一类型，从历史恢复以便修改
    if (t && t.date === todayKey()) saveDraft();  // 先保存当前标签
    var dr = loadDraft().days[day];
    var h = dr ? dr : state.history.find(function (x) { return x.date === todayKey() && x.dayType === day; });
    state.today = h ? normSession(JSON.parse(JSON.stringify(h))) : emptySession(day);
  }
  // 与计划对齐（旧 id 保留数据）
  var byId = {}; state.today.exercises.forEach(function (e) { byId[e.id] = e; });
  (state.today.stash || []).forEach(function (e) { if (!byId[e.id]) byId[e.id] = e; });
  var ids = plan[day];
  state.today.stash = Object.keys(byId).filter(function (id) { return ids.indexOf(id) < 0 && byId[id].sets.some(function (s) { return s.done || s.weight || s.reps; }); }).map(function (id) { return byId[id]; });
  if (!state.today.stash.length) delete state.today.stash;
  state.today.exercises = curPlan(day).map(function (d) {
    var e = byId[d.id];
    if (!e) {
      e = { id: d.id, sets: lastSetsFor(d.id, d.sets).map(function (r) { return newSet(r); }) };
    } else {
      while (e.sets.length < d.sets) {
        var r = lastSetsFor(d.id, d.sets)[e.sets.length] || { weight: "", reps: "" };
        e.sets.push(newSet(r));
      }
    }
    return e;
  });
  saveState();
}


/* ---------- 卡路里估算 (近似) ----------
 * 混合模型 = 机械功部分 + 时间(MET)部分，均为“净”消耗（已扣除静息）。
 * 1) 机械功: W = (外部负重kg × 哑铃个数 + 体重 × 体重占比) × 9.81 × 动作行程ROM(m) × 次数
 *    代谢消耗 kcal = W / 效率0.22 / 4184   （人体肌肉总效率约 20–25%）
 * 2) 时间部分: (MET 5.0 − 1) × 体重kg × 每组时长(约40秒发力 + 80秒组间 = 2分钟)/60
 *    MET 5.0 取自 2024 Adult Compendium of Physical Activities 抗阻训练
 *    (02054 = 3.5 一般多动作 8–15 次; 02050 = 6.0 健美/大强度; 取中间值)，减 1 MET 避免与静息重复计算。
 * 来源 / 参考:
 *  - Herrmann SD et al. 2024 Adult Compendium of Physical Activities, J Sport Health Sci 2024 — https://pacompendium.com/conditioning-exercise/
 *  - 机械功÷效率法 (同思路，20% 效率): https://sport-calculator.com/calculators/gym/squat-calorie-calculator
 *  - MET 公式参考 finegym-io/fitness-calc (MIT) 的 calculateCaloriesBurned；此处为自写实现，未复制代码。
 * ROM / 体重占比为经验估计；器械/绳索只算外部负重。 */
var CF = '<img class="cf" src="assets/campfire.webp" alt="">';
var KC = { eff: 0.22, met: 5.0, setMin: 2 };
// id: [ROM米, 体重占比, 哑铃个数(kg按单只填写时×2)]
var KX = {
  bench: [0.40, 0, 1], ohp: [0.50, 0, 2], fly: [0.30, 0, 1], lateral: [0.45, 0, 2], pushdown: [0.30, 0, 1],
  latpulldown: [0.50, 0, 1], seatedrow: [0.40, 0, 1], tbar: [0.35, 0, 1], facecpull: [0.30, 0, 1], curl: [0.40, 0, 2],
  squat: [0.50, 0.8, 1], rdl: [0.45, 0.5, 1], legcurl: [0.35, 0, 1], legext: [0.35, 0, 1], core: [0.25, 0.3, 1],
  incline: [0.40, 0, 2], pushup: [0.30, 0.65, 1], ohtri: [0.40, 0, 1],
  srow: [0.35, 0, 1], hammer: [0.40, 0, 2], reardelt: [0.45, 0, 2], shrug: [0.08, 0, 2],
  lunge: [0.45, 0.8, 2], goblet: [0.50, 0.8, 1], hipthrust: [0.20, 0.6, 1], calf: [0.08, 1.0, 2]
};
function bodyKg() {
  var w = loadWeights(); if (w.length) return w[w.length - 1].kg;
  return +loadProfile().w || 75;
}
/* 有氧：距离 → 跑步净消耗 ≈ 1.0 kcal/kg/km (ACSM Guidelines 跑步代谢方程，净耗能约 1 kcal·kg⁻¹·km⁻¹)；
 *        骑行 ≈ 0.35 kcal/kg/km（Compendium 01015 一般骑行 6.8 MET 按约 16–19 km/h 换算：(6.8−1)/17 ≈ 0.34）
 *  时间 → (MET − 1) × 体重 × 小时，与力量部分一致用净值；Compendium 2024: 12020 慢跑 一般 7.0 MET，01015 骑行 一般/休闲 6.8 MET */
var CARD = { run: { met: 7.0, km: 1.0 }, bike: { met: 6.8, km: 0.35 } };
function cardioKcal(d, s, bw) {
  var v = parseFloat(s.weight); if (!(v > 0)) return 0;
  var c = CARD[d.cardio], u = s.unit || "min";
  if (u === "min") return (c.met - 1) * bw * v / 60;
  return c.km * bw * (u === "km" ? v : v / 1000);
}
function setKcal(id, s, bw) {
  if (!s || !s.done) return 0;
  if (isCardio(id)) return cardioKcal(EX_BY_ID[id], s, bw);
  var x = KX[id] || [0.35, 0, 1], d = EX_BY_ID[id];
  var reps = parseFloat(s.reps); if (!(reps > 0)) reps = d ? parseFloat(String(d.reps)) || 10 : 10;
  var kg = parseFloat(s.weight); if (!(kg > 0)) kg = 0;
  var work = (kg * x[2] + bw * x[1]) * 9.81 * x[0] * reps;
  return work / KC.eff / 4184 + (KC.met - 1) * bw * KC.setMin / 60;
}
function exKcal(e, bw) { var t = 0; (e.sets || []).forEach(function (s) { t += setKcal(e.id, s, bw); }); return t; }
function sessKcal(h, bw) { bw = bw || bodyKg(); var t = 0; (h.exercises || []).forEach(function (e) { t += exKcal(e, bw); }); return t; }
function updateKcal() {
  if (!state.today) return; var bw = bodyKg();
  $("kcal").textContent = Math.round(sessKcal(state.today, bw));
  state.today.exercises.forEach(function (e, i) { var el = document.querySelector('[data-ek="' + i + '"]'); if (el) { var k = Math.round(exKcal(e, bw)); el.innerHTML = k ? CF + k : ""; } });
}
$("kcInfo").onclick = function () { $("kcModal").classList.add("on"); };
/* ---------- main UI ---------- */
function progress() {
  var done = 0, total = 0;
  if (state.today) state.today.exercises.forEach(function (e) { e.sets.forEach(function (s) { total++; if (s.done) done++; }); });
  return { done: done, total: total };
}
function updateProgress() {
  updateKcal();
  var p = progress();
  $("progText").textContent = "今日进度 " + p.done + "/" + p.total + " 组";
  $("progBar").style.width = (p.total ? p.done / p.total * 100 : 0) + "%";
}
function updateSuggest() {
  var s = suggestedDay();
  $("suggest").textContent = state.lastCompletedDay ? "上次练「" + DAY_SHORT[state.lastCompletedDay] + "」，今天建议练「" + DAY_SHORT[s] + "」💪" : "第一次打卡，从「推」开始吧 💪";
}
function renderTabs() {
  var sug = suggestedDay();
  [].forEach.call(document.querySelectorAll("#tabs .tab"), function (b) {
    var d = b.dataset.day; b.classList.toggle("on", d === curDay);
    b.textContent = DAY_SHORT[d] + (d === curDay ? " 💪" : "") + (d === sug && d !== curDay ? " ·荐" : "");
  });
}
function renderCards() {
  var html = curPlan(curDay).map(function (d, i) {
    var e = state.today.exercises[i];
    var rows = e.sets.map(function (s, j) {
      if (d.cardio) return '<div class="set"><button class="ck' + (s.done ? " on" : "") + '" data-ck="' + i + "," + j + '" aria-label="完成第' + (j + 1) + '组">' + (s.done ? "✓" : "") + '</button>组 ' + (j + 1) +
        '<input class="in cv" inputmode="decimal" placeholder=" " data-f="weight" data-ij="' + i + "," + j + '" value="' + esc(s.weight) + '"><button class="un" data-un="' + i + "," + j + '">' + (s.unit || "min") + '</button></div>';
      return '<div class="set"><button class="ck' + (s.done ? " on" : "") + '" data-ck="' + i + "," + j + '" aria-label="完成第' + (j + 1) + '组">' + (s.done ? "✓" : "") + '</button>组 ' + (j + 1) +
        '<input class="in" inputmode="decimal" placeholder=" " data-f="weight" data-ij="' + i + "," + j + '" value="' + esc(s.weight) + '">kg ×' +
        '<input class="in" inputmode="numeric" placeholder=" " data-f="reps" data-ij="' + i + "," + j + '" value="' + esc(s.reps) + '">次</div>';
    }).join("");
    return '<div class="card" data-i="' + i + '"><button class="dots" data-dots="' + i + '" aria-label="更多">⋯</button><h3>' + d.name + "<small>" + (d.cardio ? d.reps : d.sets + "×" + d.reps) + '</small><em class="ek" data-ek="' + i + '"></em></h3><div class="row"><button class="img" data-mus="' + i + '" aria-label="查看发力肌群"><img src="' + A + d.img + '-action.webp" alt="' + d.name + '" loading="lazy"></button><div class="sets">' + rows + (d.cardio && e.sets.length < 6 ? '<button class="addrow" data-add="' + i + '">＋ 加一组</button>' : "") + "</div></div></div>";
  }).join("");
  $("cards").innerHTML = html + '<button class="addex" id="addEx">＋ 添加动作</button>';
}
function selectDay(day) { curDay = day; ensureToday(day); renderTabs(); renderCards(); updateProgress(); }

$("tabs").addEventListener("click", function (ev) { var b = ev.target.closest(".tab"); if (b) selectDay(b.dataset.day); });
$("cards").addEventListener("click", function (ev) {
  var c = ev.target.closest("[data-ck]");
  if (c) { var ij = c.dataset.ck.split(","), s = state.today.exercises[ij[0]].sets[ij[1]]; s.done = !s.done; c.classList.toggle("on", s.done); c.textContent = s.done ? "✓" : ""; saveState(); updateProgress(); return; }
  var u = ev.target.closest("[data-un]");
  if (u) { var uj = u.dataset.un.split(","), us = state.today.exercises[uj[0]].sets[uj[1]]; us.unit = UNITS[(UNITS.indexOf(us.unit || "min") + 1) % 3]; u.textContent = us.unit; saveState(); updateKcal(); return; }
  var ad = ev.target.closest("[data-add]");
  if (ad) { var ae = state.today.exercises[ad.dataset.add], ls = ae.sets[ae.sets.length - 1] || {}; ae.sets.push({ done: false, weight: "", reps: "", unit: ls.unit || "min" }); saveState(); renderCards(); updateProgress(); return; }
  var m = ev.target.closest("[data-mus]");
  if (m) { openMuscle(curPlan(curDay)[m.dataset.mus]); return; }
  var o = ev.target.closest("[data-dots]"); if (o) { openMenu(+o.dataset.dots, o); return; }
  if (ev.target.closest("#addEx")) openLib(-1);
});
var saveT;
function flush() { clearTimeout(saveT); saveState(); }
["change", "focusout"].forEach(function (t) { $("cards").addEventListener(t, flush); });
document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") flush(); });
window.addEventListener("pagehide", flush);
$("cards").addEventListener("input", function (ev) {
  var t = ev.target; if (!t.dataset.ij) return;
  var ij = t.dataset.ij.split(","), s = state.today.exercises[ij[0]].sets[ij[1]];
  s[t.dataset.f] = t.value.trim();
  if (s.weight && (s.reps || isCardio(state.today.exercises[ij[0]].id)) && !s.done) { s.done = true; var ck = t.parentNode.querySelector(".ck"); ck.classList.add("on"); ck.textContent = "✓"; updateProgress(); } else if (s.done) updateKcal();
  clearTimeout(saveT); saveT = setTimeout(saveState, 150);
});
function openMuscle(d) { $("musTitle").textContent = d.name + " · 发力肌群"; $("musImg").src = A + d.mus + "-muscle.webp"; $("musModal").classList.add("on"); }
[].forEach.call(document.querySelectorAll(".modal"), function (m) {
  m.addEventListener("click", function (ev) { if (ev.target === m || ev.target.closest("[data-close]")) m.classList.remove("on"); });
});
$("doneBtn").onclick = function () {
  var p = progress();
  if (!p.done) { toast("还没有勾选任何一组，先打卡再完成吧～"); return; }
  state.today.completedAt = new Date().toISOString();
  state.lastCompletedDay = state.today.dayType;
  var snap = JSON.parse(JSON.stringify(state.today));
  snap.kcal = Math.round(sessKcal(snap)); snap.bodyKg = bodyKg();
  state.history = state.history.filter(function (h) { return !(h.date === snap.date && h.dayType === snap.dayType); });
  state.history.unshift(snap);
  state.history.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
  if (state.history.length > 365) state.history = state.history.slice(0, 365);
  state.today.done = true;
  saveState(); updateSuggest(); renderTabs();
  toast("已保存！完成 " + p.done + "/" + p.total + " 组，下次建议练「" + DAY_SHORT[suggestedDay()] + "」");
};

/* ---------- profile ---------- */

function renderProfile() { var p = loadProfile(), b = p.w / Math.pow(p.h / 100, 2); $("pfText").innerHTML = f1(p.h) + "cm · " + f1(p.w) + "kg · " + esc(p.lv) + ' ✏️<span class="pf-bmi">BMI ' + b.toFixed(1) + "</span>"; }
$("pfChip").onclick = function () {
  var p = loadProfile(); $("pfH").value = p.h; $("pfW").value = p.w;
  var std = ["新手", "进阶", "熟练"].indexOf(p.lv) >= 0;
  $("pfLvSel").value = std ? p.lv : "__c"; $("pfLvCustom").value = std ? "" : p.lv; $("pfLvCustom").style.display = std ? "none" : "block";
  $("pfErr").textContent = ""; $("pfMask").classList.add("on");
};
$("pfCancel").onclick = function () { $("pfMask").classList.remove("on"); };

  var h = parseFloat($("pfH").value), w = parseFloat($("pfW").value), lv = $("pfLvSel").value === "__c" ? $("pfLvCustom").value.trim() : $("pfLvSel").value;

  localStorage.setItem(PROFILE_KEY, JSON.stringify({ h: h, w: w, lv: lv }));
  if (w !== old.w) addWeight(todayKey(), w);
  renderProfile(); $("pfMask").classList.remove("on");
};

/* ---------- weight log ---------- */
function loadWeights() {
  var a; try { a = JSON.parse(localStorage.getItem(WEIGHT_KEY)); } catch (e) {}
  if (!Array.isArray(a)) a = [];
  return a.filter(function (x) { return x && /^\d{4}-\d{2}-\d{2}$/.test(x.date) && x.kg > 0; }).sort(function (a, b) { return a.date < b.date ? -1 : 1; });
}
function addWeight(date, kg) {
  var a = loadWeights().filter(function (x) { return x.date !== date; });
  a.push({ date: date, kg: Math.round(kg * 10) / 10 });
  a.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  localStorage.setItem(WEIGHT_KEY, JSON.stringify(a));
}
var wRange = "30";
$("wRange").addEventListener("click", function (ev) { var b = ev.target.closest("button"); if (!b) return; wRange = b.dataset.r; [].forEach.call(this.children, function (c) { c.classList.toggle("on", c === b); }); renderChart(); });
$("addW").onclick = function () { $("wDate").value = todayKey(); $("wKg").value = loadProfile().w; $("wErr").textContent = ""; $("wModal").classList.add("on"); };
$("wSave").onclick = function () {
  var d = $("wDate").value, kg = parseFloat($("wKg").value);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return ($("wErr").textContent = "请选择日期");
  if (!(kg >= 30 && kg <= 250)) return ($("wErr").textContent = "体重请填 30–250 kg");
  addWeight(d, kg);
  var w = loadWeights();
  if (w[w.length - 1].date === d) { var p = loadProfile(); localStorage.setItem(PROFILE_KEY, JSON.stringify({ h: p.h, w: Math.round(kg * 10) / 10, lv: p.lv })); renderProfile(); }
  $("wModal").classList.remove("on"); renderHistory();
};
function renderChart() {
  var all = loadWeights(), pts = all;
  if (wRange !== "all") { var c = new Date(); c.setDate(c.getDate() - (+wRange - 1)); var ck = dateKey(c); pts = all.filter(function (x) { return x.date >= ck; }); }
  if (!pts.length) { $("chart").innerHTML = '<div class="empty">' + (all.length ? "这段时间还没有体重记录" : "还没有体重记录，点下面记一笔吧 🐻") + "</div>"; return; }
  var W = 354, H = 170, x0 = 40, x1 = 330, y0 = 24, y1 = 136;
  var ks = pts.map(function (p) { return p.kg; }), mn = Math.min.apply(0, ks), mx = Math.max.apply(0, ks);
  if (mx - mn < 1) { var m = (mx + mn) / 2; mn = m - 0.5; mx = m + 0.5; }
  var t0 = new Date(pts[0].date).getTime(), t1 = new Date(pts[pts.length - 1].date).getTime();
  function X(p, i) { return pts.length === 1 ? (x0 + x1) / 2 : t1 === t0 ? x0 + (x1 - x0) * i / (pts.length - 1) : x0 + (x1 - x0) * (new Date(p.date).getTime() - t0) / (t1 - t0); }
  function Y(k) { return y1 - (y1 - y0) * (k - mn) / (mx - mn); }
  var xy = pts.map(function (p, i) { return [X(p, i).toFixed(1), Y(p.kg).toFixed(1)]; });
  var s = '<svg width="100%" viewBox="0 0 ' + W + " " + H + '" style="margin-top:8px;display:block">';
  s += '<g stroke="#F3E6DA" stroke-dasharray="4 4">';
  var lab = "";
  [0, 0.5, 1].forEach(function (f) { var v = mn + (mx - mn) * f, y = Y(v); s += '<line x1="36" y1="' + y + '" x2="346" y2="' + y + '"/>'; lab += '<text x="2" y="' + (y + 4) + '">' + v.toFixed(1) + "</text>"; });
  s += "</g>";
  var idx = pts.length <= 5 ? pts.map(function (_, i) { return i; }) : [0, 1, 2, 3, 4].map(function (k) { return Math.round(k * (pts.length - 1) / 4); });
  idx.forEach(function (i) { lab += '<text x="' + xy[i][0] + '" y="160" text-anchor="middle">' + md(pts[i].date) + "</text>"; });
  s += '<g font-size="11" fill="#a07070">' + lab + "</g>";
  var line = xy.map(function (p) { return p.join(","); }).join(" ");
  if (pts.length > 1) s += '<path d="M' + xy.map(function (p) { return p.join(" "); }).join(" L") + " L" + xy[xy.length - 1][0] + " " + y1 + " L" + xy[0][0] + " " + y1 + 'Z" fill="#FFD9E2" opacity=".55"/><polyline points="' + line + '" fill="none" stroke="#F27C97" stroke-width="3" stroke-linejoin="round"/>';
  s += '<g fill="#fff" stroke="#F27C97" stroke-width="2.5">' + xy.map(function (p, i) { return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="' + (i === xy.length - 1 ? 5 : 4) + '"/>'; }).join("") + "</g>";
  var lx = Math.min(Math.max(+xy[xy.length - 1][0] - 30, 0), W - 64), ly = Math.max(+xy[xy.length - 1][1] - 30, 0);
  s += '<rect x="' + lx + '" y="' + ly + '" width="62" height="22" rx="11" fill="#F27C97"/><text x="' + (lx + 31) + '" y="' + (ly + 15) + '" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">' + pts[pts.length - 1].kg.toFixed(1) + "kg</text></svg>";
  $("chart").innerHTML = s;
}

/* ---------- history ---------- */
var WEEK = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
function dObj(k) { var p = k.split("-"); return new Date(+p[0], p[1] - 1, +p[2]); }
function doneSets(h) { var n = 0; h.exercises.forEach(function (e) { e.sets.forEach(function (s) { if (s.done) n++; }); }); return n; }
function totalSets(h) { var n = 0; h.exercises.forEach(function (e) { n += e.sets.length; }); return n || 15; }
function setText(s, id) { if (isCardio(id)) return (s.weight || "✓") + (s.weight ? (s.unit || "min") : ""); if (s.weight && s.reps) return s.weight + "×" + s.reps; if (s.weight) return s.weight + "kg"; if (s.reps) return s.reps + "次"; return "✓"; }
function best(h) {
  var b = null;
  h.exercises.forEach(function (e) { e.sets.forEach(function (s) { var w = parseFloat(s.weight); if (!isCardio(e.id) && s.done && w > 0 && (!b || w > b.w)) b = { w: w, r: s.reps, id: e.id }; }); });
  if (!b) return "完成 " + doneSets(h) + " 组";
  return "最佳 " + ((EX_BY_ID[b.id] || {}).name || b.id) + " " + b.w + "kg" + (b.r ? " × " + b.r : "");
}
function renderHistory() {
  var H = state.history;
  $("stSess").textContent = H.length;
  $("stSets").textContent = H.reduce(function (a, h) { return a + doneSets(h); }, 0);
  var w = loadWeights();
  if (w.length >= 2) { var d = w[w.length - 1].kg - w[0].kg; $("stW").textContent = (d > 0 ? "+" : d < 0 ? "−" : "±") + Math.abs(d).toFixed(1) + "kg"; } else $("stW").textContent = w.length ? "±0kg" : "—";
  renderChart();
  // 训练日 strip: 最近 7 个训练日
  var days = H.slice(0, 7).reverse();
  if (!days.length) { $("strip").innerHTML = '<div class="empty" style="width:100%">还没有训练记录，今天就开练吧！</div>'; $("stripRange").textContent = ""; }
  else {
    $("strip").innerHTML = days.map(function (h) { return '<div class="d">' + md(h.date) + '<i class="' + h.dayType + '">' + DAY_SHORT[h.dayType] + "</i></div>"; }).join("");
    $("stripRange").textContent = md(days[0].date) + (days.length > 1 ? " – " + md(days[days.length - 1].date) : "");
  }
  if (!H.length) { $("sessions").innerHTML = '<div class="empty">完成一次训练后，记录会出现在这里 🐻</div>'; return; }
  $("sessions").innerHTML = H.map(function (h, k) {
    var det = h.exercises.map(function (e) {
      var d = EX_BY_ID[e.id], done = e.sets.filter(function (s) { return s.done || s.weight || s.reps; });
      if (!done.length) return "";
      return '<div class="e">' + (d ? '<img src="' + A + d.img + '-action.webp" alt="" loading="lazy">' : "") + "<b>" + esc(d ? d.name : e.id) + "</b><div>" + done.map(function (s) { return "<span>" + esc(setText(s, e.id)) + "</span>"; }).join("") + "</div></div>";
    }).join("");
    return '<div class="s' + (k === 0 ? " exp" : "") + '" data-k="' + k + '"><div class="pill ' + h.dayType + '">' + DAY_SHORT[h.dayType] + '</div><div class="m"><b>' + md(h.date) + " " + WEEK[dObj(h.date).getDay()] + "</b><div>" + esc(best(h)) + '</div></div><div class="cnt">' + doneSets(h) + "<small>/" + totalSets(h) + ' 组</small> <span class="ar">' + (k === 0 ? "▲" : "▼") + '</span><span class="kk">' + CF + ' ' + (h.kcal != null ? h.kcal : Math.round(sessKcal(h))) + ' kcal</span><span style="display:none">' + (k === 0 ? "▲" : "▼") + '</span></div><div class="det">' + (det || '<div class="note">没有记录具体组数</div>') + (h.note ? '<div class="note">📝 ' + esc(h.note) + "</div>" : "") + '<div class="note" style="text-align:right">单位：kg × 次</div></div></div>';
  }).join("");
}
$("sessions").addEventListener("click", function (ev) { var c = ev.target.closest(".s"); if (!c) return; var on = c.classList.toggle("exp"); c.querySelector(".ar").textContent = on ? "▲" : "▼"; });
function showHist(on) { document.body.classList.toggle("histmode", on); if (on) renderHistory(); window.scrollTo(0, 0); }
$("bearBtn").onclick = function () { location.hash = "history"; };
$("backBtn").onclick = function () { if (location.hash === "#history") history.back(); else showHist(false); };
window.addEventListener("hashchange", function () { showHist(location.hash === "#history"); });

/* ---------- init ---------- */

/* ---------- ⋯ 菜单 / 动作库 / 拖动排序 ---------- */
var menuI = -1, libI = -1, libG = "push", cfFn = null;
function openMenu(i, btn) {
  menuI = i; var m = $("exMenu"), r = btn.getBoundingClientRect(); m.classList.add("on");
  m.style.top = Math.min(r.bottom + 6, innerHeight - m.offsetHeight - 10) + "px"; m.style.left = Math.max(10, r.right - m.offsetWidth) + "px";
}
function closeMenu() { $("exMenu").classList.remove("on"); }
document.addEventListener("click", function (ev) { if (!ev.target.closest("#exMenu") && !ev.target.closest("[data-dots]")) closeMenu(); }, true);
window.addEventListener("scroll", closeMenu, { passive: true });
function confirmBox(t, fn) { $("cfText").textContent = t; cfFn = fn; $("cfModal").classList.add("on"); }
$("cfOk").onclick = function () { $("cfModal").classList.remove("on"); if (cfFn) cfFn(); cfFn = null; };
function planChanged() { savePlan(); ensureToday(curDay); renderCards(); updateProgress(); }
$("mDel").onclick = function () {
  closeMenu(); var i = menuI, d = curPlan(curDay)[i];
  confirmBox("删除「" + d.name + "」？", function () { plan[curDay].splice(i, 1); planChanged(); toast("已删除「" + d.name + "」"); });
};
$("mRep").onclick = function () { closeMenu(); openLib(menuI); };
function openLib(i) {
  libI = i; libG = i >= 0 ? curPlan(curDay)[i].g : curDay;
  $("libTitle").textContent = i >= 0 ? "替换「" + curPlan(curDay)[i].name + "」" : "添加动作";
  renderLib(); $("libModal").classList.add("on"); $("libList").scrollTop = 0;
}
function renderLib() {
  [].forEach.call($("libTabs").children, function (b) { b.classList.toggle("on", b.dataset.g === libG); });
  $("libList").innerHTML = LIB[libG].map(function (e) {
    var has = plan[curDay].indexOf(e.id) >= 0;
    return '<button class="li" data-id="' + e.id + '"' + (has ? " disabled" : "") + '><img src="' + A + e.img + '-action.webp" alt="" loading="lazy"><b>' + esc(e.name) + "</b><small>" + (e.cardio ? e.reps : e.sets + "×" + e.reps) + "</small></button>";
  }).join("");
}
$("libTabs").addEventListener("click", function (ev) { var b = ev.target.closest(".tab"); if (b) { libG = b.dataset.g; renderLib(); $("libList").scrollTop = 0; } });
$("libList").addEventListener("click", function (ev) {
  var b = ev.target.closest(".li"); if (!b || b.disabled) return; var id = b.dataset.id;
  if (libI >= 0) plan[curDay][libI] = id; else plan[curDay].push(id);
  $("libModal").classList.remove("on"); planChanged();
  toast((libI >= 0 ? "已替换为「" : "已添加「") + EX_BY_ID[id].name + "」");
  if (libI < 0) setTimeout(function () { var c = $("cards").querySelectorAll(".card"); c[c.length - 1].scrollIntoView({ behavior: "smooth", block: "center" }); }, 50);
});
$("resetBtn").onclick = function () { confirmBox("恢复默认动作列表？", function () { plan = defaultPlan(); localStorage.removeItem(PLAN_KEY); planChanged(); toast("已恢复默认"); }); };

var drag = null, press = null, swallow = false;
function pt(ev) { var t = ev.touches ? (ev.touches[0] || ev.changedTouches[0]) : ev; return { x: t.clientX, y: t.clientY }; }
function pressStart(ev) {
  if (drag || ev.button > 0) return;
  var card = ev.target.closest(".card"); if (!card || ev.target.closest("input")) return;
  var p = pt(ev); press = { card: card, x: p.x, y: p.y, t: setTimeout(function () { lift(card, p); }, 400) };
}
function lift(card, p) {
  press = null; closeMenu(); if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  var cards = [].slice.call($("cards").querySelectorAll(".card"));
  var sy = scrollY, info = cards.map(function (c) { var r = c.getBoundingClientRect(); return { el: c, top: r.top + sy, h: r.height }; });
  var from = cards.indexOf(card);
  drag = { card: card, cards: info, from: from, to: from, startY: p.y + sy, lastY: p.y, step: info[from].h + 14, raf: 0 };
  card.classList.add("lift");
  if (navigator.vibrate) navigator.vibrate(12);
  setTimeout(function () { if (drag) card.classList.add("drag"); }, 150);
  info.forEach(function (c, k) { if (k !== from) c.el.classList.add("shift"); });
  drag.raf = requestAnimationFrame(autoScroll);
}
function layout() {
  var d = drag, dy = d.lastY + scrollY - d.startY, me = d.cards[d.from], mid = me.top + me.h / 2 + dy, to = 0;
  d.cards.forEach(function (c, k) { if (k !== d.from && c.top + c.h / 2 < mid) to++; });
  d.to = to;
  d.card.style.transform = "translateY(" + dy + "px) scale(1.04)";
  d.cards.forEach(function (c, k) {
    if (k === d.from) return; var s = 0;
    if (d.from < to && k > d.from && k <= to) s = -d.step; else if (to < d.from && k >= to && k < d.from) s = d.step;
    c.el.style.transform = s ? "translateY(" + s + "px)" : "";
  });
}
function autoScroll() {
  if (!drag) return; var y = drag.lastY, e = 80, v = 0;
  if (y < e) v = -Math.ceil((e - y) / 6); else if (y > innerHeight - e) v = Math.ceil((y - innerHeight + e) / 6);
  if (v) { scrollBy(0, v); layout(); }
  drag.raf = requestAnimationFrame(autoScroll);
}
function pressMove(ev) {
  if (drag) { if (ev.cancelable) ev.preventDefault(); drag.lastY = pt(ev).y; layout(); return; }
  if (press) { var p = pt(ev); if (Math.abs(p.x - press.x) > 8 || Math.abs(p.y - press.y) > 8) { clearTimeout(press.t); press = null; } }
}
function pressEnd() {
  if (press) { clearTimeout(press.t); press = null; }
  if (!drag) return; var d = drag; drag = null; cancelAnimationFrame(d.raf); swallow = true; setTimeout(function () { swallow = false; }, 350);
  d.cards.forEach(function (c) { c.el.classList.remove("shift", "drag", "lift"); c.el.style.transform = ""; });
  if (d.to !== d.from) {
    var id = plan[curDay].splice(d.from, 1)[0]; plan[curDay].splice(d.to, 0, id);
    var e = state.today.exercises.splice(d.from, 1)[0]; state.today.exercises.splice(d.to, 0, e);
    savePlan(); saveState(); renderCards();
  }
}
var C = $("cards");
C.addEventListener("touchstart", pressStart, { passive: true });
document.addEventListener("touchmove", pressMove, { passive: false });
document.addEventListener("touchend", pressEnd); document.addEventListener("touchcancel", pressEnd);
C.addEventListener("mousedown", function (ev) { if (!ev.sourceCapabilities || !ev.sourceCapabilities.firesTouchEvents) pressStart(ev); });
document.addEventListener("mousemove", function (ev) { if (drag || press) pressMove(ev); });
document.addEventListener("mouseup", pressEnd);
C.addEventListener("contextmenu", function (ev) { if (ev.target.closest(".card")) ev.preventDefault(); });
C.addEventListener("click", function (ev) { if (swallow) { ev.stopPropagation(); ev.preventDefault(); swallow = false; } }, true);
renderProfile(); updateSuggest();
selectDay(state.today && state.today.date === todayKey() ? state.today.dayType : suggestedDay());
if (location.hash === "#history") showHist(true);
</script>
